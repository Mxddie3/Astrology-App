<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#03050d" />
  <title>Night Sky Companion</title>
  <style>
    :root {
      --bg: #03050d;
      --card: rgba(11, 17, 36, 0.72);
      --card-border: rgba(125, 211, 252, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #c084fc;
      --pink: #f472b6;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(36px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 80% 55% at 15% 0%, rgba(129, 140, 248, 0.24), transparent 60%),
        radial-gradient(ellipse 70% 50% at 88% 12%, rgba(192, 132, 252, 0.2), transparent 60%),
        radial-gradient(ellipse 65% 45% at 50% 100%, rgba(56, 189, 248, 0.14), transparent 65%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated deep-space starfield behind UI */
    #spaceBg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 0 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .orbit-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0f2fe, #38bdf8 45%, #4c1d95 100%);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55), 0 0 36px rgba(192, 132, 252, 0.3);
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f8fafc 0%, #7dd3fc 52%, #d8b4fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .location-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, input {
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.78);
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.88rem;
      backdrop-filter: blur(10px);
    }

    button {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(192, 132, 252, 0.28));
      border-color: rgba(125, 211, 252, 0.35);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 6, 23, 0.45);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.32);
    }

    button:active { transform: scale(0.97); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 10px 30px rgba(2, 6, 23, 0.55);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 0.78rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card h2::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .big-stat {
      font-size: 1.95rem;
      font-weight: 700;
      margin: 4px 0;
      letter-spacing: -0.02em;
    }

    .muted { color: var(--muted); font-size: 0.87rem; }

    .moon-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .moon-orb {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fef9c3, #fde047 55%, #ca8a04 100%);
      box-shadow: 0 0 22px rgba(253, 224, 71, 0.45), inset -6px -4px 12px rgba(15, 23, 42, 0.55);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .moon-shadow {
      position: absolute;
      inset: 0;
      background: rgba(5, 9, 22, 0.84);
      border-radius: 50%;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .planet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(148,
